name: Build NANDOMX APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir base
        run: |
          echo "Buscando ZIP..."
          ls -la
          ls -la NANDOMX/ || true
          ZIP=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          echo "ZIP encontrado: $ZIP"
          unzip -o "$ZIP" -d temp_unzip
          rm "$ZIP" || true
          # mover todo a la raiz
          shopt -s dotglob
          mv temp_unzip/*/* . 2>/dev/null || mv temp_unzip/* . 2>/dev/null || mv temp_unzip/NANDOMX/* . 2>/dev/null || true
          rm -rf temp_unzip
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NANDOMX-APK
          path: app/build/outputs/apk/debug/*.apk
