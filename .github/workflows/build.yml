name: Build NANDOMX APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir base
        run: |
          ZIP=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          echo "ZIP: $ZIP"
          if [ -n "$ZIP" ]; then
            unzip -o "$ZIP" -d temp_unzip
            rm "$ZIP" || true
            shopt -s dotglob
            if [ -d "temp_unzip/NANDOMX BASE LIMPIA" ]; then
              cp -r temp_unzip/NANDOMX\ BASE\ LIMPIA/* . 2>/dev/null || true
              cp -r temp_unzip/NANDOMX\ BASE\ LIMPIA/.* . 2>/dev/null || true
            else
              FOUND=$(find temp_unzip -name "gradlew" | head -n 1 | xargs dirname)
              echo "Proyecto en: $FOUND"
              cp -r $FOUND/* . 2>/dev/null || true
              cp -r $FOUND/.* . 2>/dev/null || true
            fi
            rm -rf temp_unzip NANDOMX
          fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Arreglar compatibilidad Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Bajar Gradle a 7.6.3 que es compatible con casi todas las bases
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.3-all.zip|' gradle/wrapper/gradle-wrapper.properties
            cat gradle/wrapper/gradle-wrapper.properties
          fi
      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NANDOMX-APK
          path: app/build/outputs/apk/debug/*.apk
